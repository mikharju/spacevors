name: Build SpaceVors

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            rid: linux-x64

          - name: Windows x64
            rid: win-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Game/Game.csproj

      - name: Publish game
        run: |
          dotnet publish src/Game/Game.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output ./publish/${{ matrix.rid }}

      # -------------------------
      # Linux AppImage
      # -------------------------

      - name: Install linuxdeploy
        if: matrix.rid == 'linux-x64'
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy

          chmod +x linuxdeploy

          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

          ./linuxdeploy --version

      - name: Prepare Linux AppImage
        if: matrix.rid == 'linux-x64'
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications

          cp -a ./publish/linux-x64/. AppDir/usr/bin/

          cat > AppDir/usr/share/applications/spacevors.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SpaceVors
          Comment=SpaceVors
          Exec=Game
          Icon=spacevors
          Categories=Game;
          Terminal=false
          EOF

          chmod +x AppDir/usr/bin/Game

      - name: Create Linux AppImage
        if: matrix.rid == 'linux-x64'
        run: |
          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/Game \
            --desktop-file AppDir/usr/share/applications/spacevors.desktop \
            --output appimage

          mv *.AppImage SpaceVors-x86_64.AppImage

      - name: Verify Linux AppImage
        if: matrix.rid == 'linux-x64'
        run: |
          test -f SpaceVors-x86_64.AppImage
          chmod +x SpaceVors-x86_64.AppImage
          file SpaceVors-x86_64.AppImage

      # -------------------------
      # Windows
      # -------------------------

      - name: Package Windows build
        if: matrix.rid == 'win-x64'
        run: |
          cd ./publish/win-x64
          zip -r ../../SpaceVors-windows-x64.zip .

      # -------------------------
      # Upload artifacts
      # -------------------------

      - name: Upload Linux AppImage
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: SpaceVors-linux-x64
          path: SpaceVors-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows build
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: SpaceVors-windows-x64
          path: SpaceVors-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
