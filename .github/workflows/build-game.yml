name: Build SpaceVors

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x64 AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore src/Game/Game.csproj

      - name: Publish SpaceVors
        run: |
          dotnet publish src/Game/Game.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output ./publish/linux-x64

      - name: Inspect published files
        run: |
          echo "Published files:"
          find ./publish/linux-x64 -maxdepth 2 -type f | sort

      - name: Verify game executable
        run: |
          test -f ./publish/linux-x64/Game
          chmod +x ./publish/linux-x64/Game

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications

          cp -a ./publish/linux-x64/. AppDir/usr/bin/

          chmod +x AppDir/usr/bin/Game

      - name: Create desktop file
        run: |
          cat > AppDir/usr/share/applications/spacevors.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SpaceVors
          Comment=SpaceVors
          Exec=Game
          Icon=spacevors
          Categories=Game;
          Terminal=false
          EOF

      - name: Install appimagetool
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

          ./appimagetool --version

      - name: Create AppImage
        run: |
          ./appimagetool \
            AppDir \
            SpaceVors-x86_64.AppImage

      - name: Verify AppImage
        run: |
          test -f SpaceVors-x86_64.AppImage
          chmod +x SpaceVors-x86_64.AppImage

          echo "AppImage:"
          ls -lh SpaceVors-x86_64.AppImage

          file SpaceVors-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SpaceVors-linux-x64
          path: SpaceVors-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
