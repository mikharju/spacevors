name: Build SpaceVors

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x64 AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore src/Game/Game.csproj

      - name: Publish SpaceVors
        run: |
          dotnet publish src/Game/Game.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output ./publish/linux-x64

      - name: Inspect published executable
        run: |
          echo "Game executable:"
          ls -lah ./publish/linux-x64/Game

          echo
          echo "File type:"
          file ./publish/linux-x64/Game

          echo
          echo "Dynamic dependencies:"
          ldd ./publish/linux-x64/Game || true

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin

          cp -a ./publish/linux-x64/. AppDir/usr/bin/

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/Game" "$@"
          EOF

          chmod +x AppDir/AppRun
          chmod +x AppDir/usr/bin/Game

      - name: Prepare AppImage icon
        run: |
          test -f assets/player-ships/shadow-texture.png

          cp \
            assets/player-ships/shadow-texture.png \
            AppDir/spacevors.png

      - name: Create desktop file
        run: |
          cat > AppDir/spacevors.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SpaceVors
          Comment=Space survival game
          Exec=SpaceVors
          Icon=spacevors
          Categories=Game;
          Terminal=false
          EOF

      - name: Verify AppDir
        run: |
          echo "AppDir contents:"
          find AppDir -maxdepth 3 -type f -print | sort

          echo
          echo "AppRun:"
          ls -l AppDir/AppRun

          echo
          echo "Game executable:"
          ls -l AppDir/usr/bin/Game

          echo
          echo "Icon:"
          file AppDir/spacevors.png

          echo
          echo "Desktop file:"
          cat AppDir/spacevors.desktop

          test -x AppDir/AppRun
          test -x AppDir/usr/bin/Game
          test -f AppDir/spacevors.desktop
          test -f AppDir/spacevors.png

      - name: Install appimagetool
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

          ./appimagetool --version

      - name: Create AppImage
        run: |
          ./appimagetool \
            AppDir \
            SpaceVors-x86_64.AppImage

      - name: Verify AppImage
        run: |
          test -f SpaceVors-x86_64.AppImage
          chmod +x SpaceVors-x86_64.AppImage

          echo "AppImage:"
          ls -lh SpaceVors-x86_64.AppImage

          echo
          echo "File type:"
          file SpaceVors-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SpaceVors-linux-x64
          path: SpaceVors-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore src/Game/Game.csproj

      - name: Publish SpaceVors
        run: |
          dotnet publish src/Game/Game.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output ./publish/win-x64

      - name: Inspect Windows build
        run: |
          echo "Windows executable:"
          ls -lah ./publish/win-x64/Game.exe

          echo
          echo "Published files:"
          find ./publish/win-x64 -maxdepth 2 -type f | sort

      - name: Package Windows build
        run: |
          cd ./publish/win-x64
          zip -r ../../SpaceVors-windows-x64.zip .

      - name: Verify Windows package
        run: |
          test -f SpaceVors-windows-x64.zip
          ls -lh SpaceVors-windows-x64.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SpaceVors-windows-x64
          path: SpaceVors-windows-x64.zip
          if-no-files-found: error
          retention-days: 30